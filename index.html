<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เว็บแรกของฉัน</title>
  <style>
    body {
      font-family: system-ui, "Noto Sans Thai", sans-serif;
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 20px;
      line-height: 1.7;
      color: #1f2937;
      background: #f8fafc;
    }
    h1 { font-size: 2rem; margin-bottom: 0.25em; }
    a { color: #2563eb; }
    button {
      font: inherit;
      padding: 10px 20px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>สวัสดีชาวโลก 👋</h1>
  <p>นี่คือเว็บไซต์แรกของฉัน สร้างด้วย HTML และเผยแพร่บน GitHub Pages</p>

  <h2>เกี่ยวกับฉัน</h2>
  <p>แก้ข้อความตรงนี้เป็นการแนะนำตัวของคุณได้เลย</p>

  <h2>ติดต่อ</h2>
  <p>อีเมล: <a href="mailto:you@example.com">you@example.com</a></p>

  <button onclick="alert('ยินดีต้อนรับ!')">กดทักทาย</button>
</body>
</html>
